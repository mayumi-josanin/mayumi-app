<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>まゆみ助産院 アプリ</title>
<link rel="icon" href="data:," />
<style>
  :root {
    --sage: #5b8c5a;
    --sage-dark: #47703f;
    --bg: #f7f5ef;
    --card: #ffffff;
    --text: #2f3327;
    --muted: #6d7266;
    --line: #e2ded2;
    --danger: #c0392b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px 48px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    line-height: 1.7;
  }
  .wrap { max-width: 520px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 24px; }
  header h1 { font-size: 20px; margin: 0 0 4px; }
  header p { font-size: 13px; color: var(--muted); margin: 0; }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 16px;
  }

  .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .tab {
    flex: 1; padding: 12px; font-size: 15px; text-align: center; cursor: pointer;
    border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--muted);
  }
  .tab[aria-selected="true"] { background: var(--sage); border-color: var(--sage); color: #fff; font-weight: 700; }

  label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
  input {
    width: 100%; padding: 14px; font-size: 16px;
    border: 1px solid var(--line); border-radius: 10px; background: #fff;
  }
  button.primary {
    width: 100%; margin-top: 18px; padding: 15px; font-size: 16px; font-weight: 700;
    color: #fff; background: var(--sage); border: 0; border-radius: 10px; cursor: pointer;
  }
  button.primary:disabled { opacity: .6; cursor: default; }
  button.link {
    width: 100%; margin-top: 10px; padding: 12px; font-size: 14px;
    color: var(--muted); background: none; border: 0; cursor: pointer; text-decoration: underline;
  }
  .error { color: var(--danger); font-size: 13px; min-height: 20px; margin: 10px 0 0; }
  .note { font-size: 12px; color: var(--muted); margin-top: 12px; }

  .who { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .who strong { font-size: 15px; }

  a.app {
    display: block; text-decoration: none; color: inherit;
    border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-top: 12px;
    background: #fff;
  }
  a.app:active { background: #f2f0e8; }
  a.app .name { font-size: 16px; font-weight: 700; color: var(--sage-dark); }
  a.app .desc { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .locked { opacity: .5; }
  .locked .desc { color: var(--danger); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>まゆみ助産院 アプリ</h1>
    <p>ログインすると、ご利用いただけるアプリが表示されます</p>
  </header>

  <!-- ================= ログイン ================= -->
  <section id="loginView" class="card">
    <div class="tabs" role="tablist">
      <div class="tab" id="tabCustomer" role="tab" aria-selected="true">お客様</div>
      <div class="tab" id="tabAdmin" role="tab" aria-selected="false">スタッフ</div>
    </div>

    <form id="customerForm">
      <label>お名前（漢字・フルネーム）
        <input name="name" type="text" autocomplete="name" required />
      </label>
      <label>フリガナ（カタカナ）
        <input name="nameKana" type="text" autocapitalize="characters" required />
      </label>
      <label>パスコード（4桁または6桁の数字）
        <input name="passcode" type="password" inputmode="numeric" autocomplete="current-password" required />
      </label>
      <p class="error" id="customerError"></p>
      <button class="primary" type="submit">ログイン</button>
    </form>

    <form id="adminForm" hidden>
      <label>管理パスワード
        <input name="password" type="password" autocomplete="current-password" required />
      </label>
      <p class="error" id="adminError"></p>
      <button class="primary" type="submit">ログイン</button>
    </form>
  </section>

  <!-- ================= アプリ選択 ================= -->
  <section id="appsView" class="card" hidden>
    <div class="who">
      <div><strong id="whoName"></strong><div class="desc" id="whoRole"></div></div>
      <button class="link" id="logoutButton" style="width:auto;margin:0;">ログアウト</button>
    </div>
    <div id="appList"></div>
    <p class="note" id="appsNote"></p>
  </section>

</div>

<script>
(function () {
  'use strict';

  // 4つのアプリは同じ origin（mayumi-josanin.github.io）にあるため、
  // ここで保存したトークンを各アプリがそのまま読める。これがSSOの土台。
  var MAYUMI_GAS = 'https://script.google.com/macros/s/AKfycbzf3iBSe2IFIeJJgaGxd4_MeFVErRnKdS2Y9C4xkPA1d6If5dgKhm-rjRAwqtYE6CotCA/exec';
  var BIJIRIS_GAS = 'https://script.google.com/macros/s/AKfycbyZfGreoBxYYaB5i0NX1Hw_9eAMD5Q1YTfzKORYyLc2-TQt6R6xblkUNyW8SlEih4QW/exec';

  // 各アプリが読みに来るキー。名前を変えると再ログインを求められてしまう。
  var ADMIN_TOKEN_KEY = 'mayumi_admin_auth_token';
  var CUSTOMER_TOKEN_KEY = 'mayumi_bijiris_customer_token';
  var SESSION_KEY = 'mayumi_launcher_session';

  var APPS = {
    mayumiCustomer: { name: 'まゆみ助産院', desc: '予約・お知らせ・ショップ', url: '../' },
    bijiris:        { name: 'ビジリス',     desc: 'アンケート・計測の記録',   url: '../../mayumi_bijiris/customer-app/' },
    mayumiAdmin:    { name: 'まゆみ助産院 管理', desc: '会員・注文・売上の管理', url: '../admin/' },
    bijirisAdmin:   { name: 'ビジリス 管理',     desc: '回答・計測の管理',       url: '../../mayumi_bijiris/admin-app/' }
  };

  function $(id) { return document.getElementById(id); }

  function store(key, value) {
    try { value ? localStorage.setItem(key, value) : localStorage.removeItem(key); }
    catch (e) { /* プライベートモードでは保存できない */ }
  }
  function read(key) {
    try { return localStorage.getItem(key) || ''; } catch (e) { return ''; }
  }

  // ---- 画面の切り替え ----
  function showTab(which) {
    var isAdmin = which === 'admin';
    $('tabAdmin').setAttribute('aria-selected', String(isAdmin));
    $('tabCustomer').setAttribute('aria-selected', String(!isAdmin));
    $('adminForm').hidden = !isAdmin;
    $('customerForm').hidden = isAdmin;
  }

  function renderApps(session) {
    $('loginView').hidden = true;
    $('appsView').hidden = false;
    $('whoName').textContent = session.label;
    $('whoRole').textContent = session.role === 'admin' ? 'スタッフとしてログイン中' : 'お客様としてログイン中';

    var keys = session.role === 'admin'
      ? ['mayumiCustomer', 'bijiris', 'mayumiAdmin', 'bijirisAdmin']
      : session.apps;

    var html = '';
    keys.forEach(function (key) {
      var app = APPS[key];
      if (!app) return;
      html += '<a class="app" href="' + app.url + '">' +
              '<div class="name">' + app.name + '</div>' +
              '<div class="desc">' + app.desc + '</div></a>';
    });
    $('appList').innerHTML = html;

    // 正直に書く。まだ再ログインを求めてくるアプリがある。
    $('appsNote').textContent = session.role === 'admin'
      ? 'まゆみ助産院の管理アプリは、そのままお使いいただけます。ビジリスの管理アプリは、現在まだ個別のログインが必要です。'
      : 'ビジリスはそのままお使いいただけます。';
  }

  function logout() {
    store(ADMIN_TOKEN_KEY, '');
    store(CUSTOMER_TOKEN_KEY, '');
    store(SESSION_KEY, '');
    $('appsView').hidden = true;
    $('loginView').hidden = false;
    $('adminError').textContent = '';
    $('customerError').textContent = '';
    $('adminForm').reset();
    $('customerForm').reset();
  }

  // ---- 通信 ----
  // GAS の /exec は JSONP でないと応答を読めない場面があるため、
  // 読み取りが必要なものは script タグ経由で取得する。
  function jsonp(baseUrl, action, params) {
    return new Promise(function (resolve, reject) {
      var name = 'launcherCb_' + Date.now() + '_' + Math.floor(Math.random() * 1e6);
      var script = document.createElement('script');
      var timer = setTimeout(function () { cleanup(); reject(new Error('応答がありません。')); }, 20000);

      function cleanup() {
        clearTimeout(timer);
        try { delete window[name]; } catch (e) { window[name] = undefined; }
        if (script.parentNode) script.parentNode.removeChild(script);
      }

      window[name] = function (data) {
        cleanup();
        if (data && data.error) { reject(new Error(data.error)); return; }
        resolve(data);
      };

      var url = new URL(baseUrl);
      url.searchParams.set('action', action);
      url.searchParams.set('callback', name);
      Object.keys(params || {}).forEach(function (k) {
        if (params[k] !== undefined && params[k] !== null) url.searchParams.set(k, params[k]);
      });
      script.src = url.toString();
      script.onerror = function () { cleanup(); reject(new Error('接続できませんでした。')); };
      document.head.appendChild(script);
    });
  }

  // ---- スタッフのログイン ----
  $('adminForm').addEventListener('submit', function (event) {
    event.preventDefault();
    var button = event.currentTarget.querySelector('button');
    var password = event.currentTarget.password.value;
    $('adminError').textContent = '';
    button.disabled = true;

    fetch(MAYUMI_GAS, {
      method: 'POST',
      redirect: 'follow',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ type: 'adminLogin', password: password })
    })
      .then(function (res) { return res.json(); })
      .then(function (json) {
        if (!json || json.status !== 'ok' || !json.token) {
          throw new Error((json && json.message) || 'ログインできませんでした。');
        }
        store(ADMIN_TOKEN_KEY, json.token);
        var session = { role: 'admin', label: 'スタッフ' };
        store(SESSION_KEY, JSON.stringify(session));
        renderApps(session);
      })
      .catch(function (error) { $('adminError').textContent = error.message; })
      .then(function () { button.disabled = false; });
  });

  // ---- お客様のログイン ----
  $('customerForm').addEventListener('submit', function (event) {
    event.preventDefault();
    var form = event.currentTarget;
    var button = form.querySelector('button');
    $('customerError').textContent = '';
    button.disabled = true;

    jsonp(BIJIRIS_GAS, 'customerLogin', {
      name: form.name.value,
      nameKana: form.nameKana.value,
      passcode: form.passcode.value
    })
      .then(function (data) {
        if (!data || !data.token) throw new Error('ログインできませんでした。');
        store(CUSTOMER_TOKEN_KEY, data.token);

        // どのアプリを出すかは、その方の登録状況で決める。
        // ビジリスにログインできた時点でビジリスは利用者。
        // まゆみ助産院アプリは会員登録が無くても使える案内用アプリなので常に出す。
        var label = (data.customerProfile && data.customerProfile.name) || form.name.value;
        var session = { role: 'customer', label: label + ' 様', apps: ['mayumiCustomer', 'bijiris'] };
        store(SESSION_KEY, JSON.stringify(session));
        renderApps(session);
      })
      .catch(function (error) { $('customerError').textContent = error.message; })
      .then(function () { button.disabled = false; });
  });

  $('tabAdmin').addEventListener('click', function () { showTab('admin'); });
  $('tabCustomer').addEventListener('click', function () { showTab('customer'); });
  $('logoutButton').addEventListener('click', logout);

  // ---- 起動時 ----
  // 前回のログインが残っていれば、そのままアプリ選択を表示する。
  (function restore() {
    var raw = read(SESSION_KEY);
    if (!raw) return;
    var session;
    try { session = JSON.parse(raw); } catch (e) { return; }
    if (!session || !session.role) return;
    var token = session.role === 'admin' ? read(ADMIN_TOKEN_KEY) : read(CUSTOMER_TOKEN_KEY);
    if (!token) { store(SESSION_KEY, ''); return; }
    renderApps(session);
  })();
})();
</script>
</body>
</html>
