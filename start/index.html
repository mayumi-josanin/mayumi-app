<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>まゆみ助産院 アプリ</title>
<link rel="icon" href="data:," />
<style>
  :root {
    --sage: #5b8c5a;
    --sage-dark: #47703f;
    --bg: #f7f5ef;
    --card: #ffffff;
    --text: #2f3327;
    --muted: #6d7266;
    --line: #e2ded2;
    --danger: #c0392b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px 48px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    line-height: 1.7;
  }
  .wrap { max-width: 520px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 24px; }
  header h1 { font-size: 20px; margin: 0 0 4px; }
  header p { font-size: 13px; color: var(--muted); margin: 0; }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 16px;
  }

  .tabs { display: flex; gap: 8px; margin-bottom: 18px; }
  .tab {
    flex: 1; padding: 12px; font-size: 15px; text-align: center; cursor: pointer;
    border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--muted);
  }
  .tab[aria-selected="true"] {
    background: var(--sage); border-color: var(--sage); color: #fff; font-weight: 700;
  }

  label { display: block; font-size: 13px; color: var(--muted); margin: 14px 0 4px; }
  input {
    width: 100%; padding: 14px; font-size: 16px;
    border: 1px solid var(--line); border-radius: 10px; background: #fff;
  }
  button.primary {
    width: 100%; margin-top: 20px; padding: 15px; font-size: 16px; font-weight: 700;
    color: #fff; background: var(--sage); border: 0; border-radius: 10px; cursor: pointer;
  }
  button.primary:disabled { opacity: .6; cursor: default; }
  .error { color: var(--danger); font-size: 13px; min-height: 20px; margin: 12px 0 0; }
  .note { font-size: 12px; color: var(--muted); margin-top: 14px; }

  .who { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 4px; }
  .who strong { font-size: 16px; }
  .who .role { font-size: 12px; color: var(--muted); }
  .who button {
    flex-shrink: 0; padding: 8px 14px; font-size: 13px; color: var(--muted);
    background: #fff; border: 1px solid var(--line); border-radius: 8px; cursor: pointer;
  }

  a.app {
    display: block; text-decoration: none; color: inherit;
    border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-top: 12px; background: #fff;
  }
  a.app:active { background: #f2f0e8; }
  a.app .name { font-size: 16px; font-weight: 700; color: var(--sage-dark); }
  a.app .desc { font-size: 13px; color: var(--muted); margin-top: 2px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>まゆみ助産院 アプリ</h1>
    <p>ログインすると、ご利用いただけるアプリが表示されます</p>
  </header>

  <section id="loginView" class="card">
    <div class="tabs" role="tablist">
      <div class="tab" id="tabLogin" role="tab" aria-selected="true">ログイン</div>
      <div class="tab" id="tabRegister" role="tab" aria-selected="false">はじめての方</div>
    </div>

    <form id="loginForm">
      <label>お名前（漢字・フルネーム）
        <input name="name" type="text" autocomplete="name" required />
      </label>
      <label>パスワード
        <input name="password" type="password" autocomplete="current-password" required />
      </label>
      <p class="error" id="loginError"></p>
      <button class="primary" type="submit">ログイン</button>
    </form>

    <form id="registerForm" hidden>
      <label>お名前（漢字・フルネーム）
        <input name="name" type="text" autocomplete="name" required />
      </label>
      <label>フリガナ（カタカナ）
        <input name="kana" type="text" autocapitalize="characters" required />
      </label>
      <label>生年月日
        <input name="birthday" type="date" required />
      </label>
      <label>電話番号
        <input name="phone" type="tel" autocomplete="tel" required />
      </label>
      <label>ご住所
        <input name="address" type="text" autocomplete="street-address" required />
      </label>
      <label>パスワード（8文字以上）
        <input name="password" type="password" autocomplete="new-password" required />
      </label>
      <p class="error" id="registerError"></p>
      <button class="primary" type="submit">登録する</button>
      <p class="note">
        すでに当院をご利用の方は、お名前と生年月日が一致すれば、
        これまでの記録を引き継いでパスワードだけ設定します。
      </p>
    </form>
  </section>

  <section id="appsView" class="card" hidden>
    <div class="who">
      <div>
        <strong id="whoName"></strong>
        <div class="role" id="whoRole"></div>
      </div>
      <button type="button" id="logoutButton">ログアウト</button>
    </div>
    <div id="appList"></div>
    <p class="note" id="appsNote"></p>

    <!-- ビジリスをご利用の方の初回登録。登録済みの方には出さない。 -->
    <div id="bijirisSignup" hidden style="margin-top:22px;padding-top:18px;border-top:1px solid var(--line);">
      <strong style="font-size:15px;">ビジリスをご利用の方へ</strong>
      <p class="note" style="margin-top:4px;">
        初回のみ登録が必要です。登録すると、次回からログインするだけで
        ビジリスが一覧に表示されます。
      </p>
      <form id="bijirisForm">
        <label>お名前（漢字・フルネーム）
          <input name="name" type="text" autocomplete="name" required />
        </label>
        <label>フリガナ（カタカナ）
          <input name="kana" type="text" autocapitalize="characters" required />
        </label>
        <label>パスワード（ログインと同じもの）
          <input name="password" type="password" autocomplete="current-password" required />
        </label>
        <p class="error" id="bijirisError"></p>
        <button class="primary" type="submit">ビジリスを登録する</button>
      </form>
    </div>
  </section>

</div>

<script>
(function () {
  'use strict';

  // 4つのアプリは同じ origin（mayumi-josanin.github.io）にあるため、
  // ここで保存したトークンを各アプリがそのまま読める。これがSSOの土台。
  var MAYUMI_GAS = 'https://script.google.com/macros/s/AKfycbzf3iBSe2IFIeJJgaGxd4_MeFVErRnKdS2Y9C4xkPA1d6If5dgKhm-rjRAwqtYE6CotCA/exec';

  // 管理アプリが読みに来るキー。変えると再ログインを求められてしまう。
  var ADMIN_TOKEN_KEY = 'mayumi_admin_auth_token';
  var MEMBER_TOKEN_KEY = 'mayumi_member_auth_token';
  var SESSION_KEY = 'mayumi_launcher_session';

  // ビジリスは別リポジトリなので絶対URLにする。
  // 相対パス（../../）だと、確認用サーバーのように mayumi-app だけを配信している
  // 環境では配信範囲の外に出てしまい、リンクが切れる。
  var BIJIRIS_BASE = 'https://mayumi-josanin.github.io/mayumi_bijiris/';

  var APPS = {
    mayumiCustomer: { name: 'まゆみ助産院',      desc: '予約・お知らせ・ショップ', url: '../' },
    bijiris:        { name: 'ビジリス',          desc: 'アンケート・計測の記録',   url: BIJIRIS_BASE + 'customer-app/' },
    mayumiAdmin:    { name: 'まゆみ助産院 管理', desc: '会員・注文・売上の管理',   url: '../admin/' },
    bijirisAdmin:   { name: 'ビジリス 管理',     desc: '回答・計測の管理',         url: BIJIRIS_BASE + 'admin-app/' }
  };

  function $(id) { return document.getElementById(id); }

  function store(key, value) {
    try { value ? localStorage.setItem(key, value) : localStorage.removeItem(key); }
    catch (e) { /* プライベートモードでは保存できない */ }
  }
  function read(key) {
    try { return localStorage.getItem(key) || ''; } catch (e) { return ''; }
  }

  function showTab(which) {
    var isRegister = which === 'register';
    $('tabRegister').setAttribute('aria-selected', String(isRegister));
    $('tabLogin').setAttribute('aria-selected', String(!isRegister));
    $('registerForm').hidden = !isRegister;
    $('loginForm').hidden = isRegister;
  }

  function renderApps(session) {
    $('loginView').hidden = true;
    $('appsView').hidden = false;
    $('whoName').textContent = session.role === 'admin' ? session.name : session.name + ' 様';
    $('whoRole').textContent = session.role === 'admin' ? 'スタッフとしてログイン中' : 'ログイン中';

    // ビジリスは、登録済みの方にだけ出す。
    var keys = session.role === 'admin'
      ? ['mayumiCustomer', 'bijiris', 'mayumiAdmin', 'bijirisAdmin']
      : (session.bijiris ? ['mayumiCustomer', 'bijiris'] : ['mayumiCustomer']);

    var html = '';
    keys.forEach(function (key) {
      var app = APPS[key];
      html += '<a class="app" href="' + app.url + '">' +
              '<div class="name">' + app.name + '</div>' +
              '<div class="desc">' + app.desc + '</div></a>';
    });
    $('appList').innerHTML = html;

    // 未登録の一般会員にだけ、ビジリスの初回登録を出す。
    var needsBijiris = session.role !== 'admin' && !session.bijiris;
    $('bijirisSignup').hidden = !needsBijiris;
    if (needsBijiris) {
      $('bijirisForm').elements.name.value = session.name || '';
    }

    // できていないことを、できている風に見せない。
    $('appsNote').textContent = session.role === 'admin'
      ? 'まゆみ助産院の管理アプリは、そのままお使いいただけます。ビジリスの管理アプリは、現在まだ個別のログインが必要です。'
      : 'まゆみ助産院アプリはそのままお使いいただけます。ビジリスは現在まだ個別のログインが必要です。';
  }

  function logout() {
    store(ADMIN_TOKEN_KEY, '');
    store(MEMBER_TOKEN_KEY, '');
    store(SESSION_KEY, '');
    $('appsView').hidden = true;
    $('loginView').hidden = false;
    $('loginError').textContent = '';
    $('registerError').textContent = '';
    $('loginForm').reset();
    $('registerForm').reset();
    showTab('login');
  }

  function applySession(json) {
    var session = {
      role: json.role,
      name: json.name,
      memberId: json.memberId,
      bijiris: json.bijiris === true
    };
    if (json.role === 'admin') {
      store(ADMIN_TOKEN_KEY, json.token);
      store(MEMBER_TOKEN_KEY, '');
    } else {
      store(MEMBER_TOKEN_KEY, json.token);
      store(ADMIN_TOKEN_KEY, '');
    }
    store(SESSION_KEY, JSON.stringify(session));
    renderApps(session);
  }

  function post(payload, button, errorEl) {
    button.disabled = true;
    errorEl.textContent = '';
    return fetch(MAYUMI_GAS, {
      method: 'POST',
      redirect: 'follow',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify(payload)
    })
      .then(function (res) { return res.json(); })
      .then(function (json) {
        if (!json || json.status !== 'ok' || !json.token) {
          throw new Error((json && json.message) || 'うまくいきませんでした。');
        }
        applySession(json);
      })
      .catch(function (error) { errorEl.textContent = error.message; })
      .then(function () { button.disabled = false; });
  }

  $('loginForm').addEventListener('submit', function (event) {
    event.preventDefault();
    var form = event.currentTarget;
    post({
      type: 'loginAccount',
      name: form.name.value,
      password: form.password.value
    }, form.querySelector('button'), $('loginError'));
  });

  $('registerForm').addEventListener('submit', function (event) {
    event.preventDefault();
    var form = event.currentTarget;
    post({
      type: 'registerAccount',
      name: form.name.value,
      kana: form.kana.value,
      birthday: form.birthday.value,
      phone: form.phone.value,
      address: form.address.value,
      password: form.password.value
    }, form.querySelector('button'), $('registerError'));
  });

  $('bijirisForm').addEventListener('submit', function (event) {
    event.preventDefault();
    var form = event.currentTarget;
    post({
      type: 'registerBijirisUse',
      name: form.name.value,
      kana: form.kana.value,
      password: form.password.value
    }, form.querySelector('button'), $('bijirisError'));
  });

  $('tabLogin').addEventListener('click', function () { showTab('login'); });
  $('tabRegister').addEventListener('click', function () { showTab('register'); });
  $('logoutButton').addEventListener('click', logout);

  // 前回のログインが残っていれば、そのままアプリ選択を表示する。
  (function restore() {
    var raw = read(SESSION_KEY);
    if (!raw) return;
    var session;
    try { session = JSON.parse(raw); } catch (e) { return; }
    if (!session || !session.role) return;
    var token = session.role === 'admin' ? read(ADMIN_TOKEN_KEY) : read(MEMBER_TOKEN_KEY);
    if (!token) { store(SESSION_KEY, ''); return; }
    renderApps(session);
  })();
})();
</script>
</body>
</html>
