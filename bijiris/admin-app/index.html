<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>ビジリス管理は新しい管理画面へ移りました</title>
    <link rel="manifest" href="./manifest.webmanifest?v=20260927-01" />
    <link rel="icon" href="./icons/icon-192.png?v=20260927-01" sizes="192x192" />
    <!--
      旧ビジリス管理アプリを閉じた（院長の依頼 2026-09-27）。
      回答・顧客・計測は 2026-09-27、アンケート定義は 2026-09-25 にサーバーへ移った。
      この画面から直しても、GAS が「サーバーへ移りました」と断る（シートへ書かない安全網）ので、
      新しい管理画面へご案内する。前の中身（app.js など）は mayumi の履歴に残っている。
      sw.js は、端末に残った前の画面を消して、この案内に切り替える作り。
    -->
    <style>
      body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
        background: #f5f5f5; color: #222; display: flex; min-height: 100vh; align-items: center; justify-content: center; }
      main { background: #fff; max-width: 440px; margin: 16px; padding: 28px 24px; border-radius: 14px;
        box-shadow: 0 4px 18px rgba(0,0,0,.08); line-height: 1.8; }
      h1 { font-size: 1.2rem; color: #3f5a34; margin: 0 0 12px; }
      a.button { display: block; text-align: center; background: #5a7a4e; color: #fff; text-decoration: none;
        padding: 14px; border-radius: 10px; font-weight: 700; margin: 20px 0 8px; }
      .note { font-size: .85rem; color: #666; }
    </style>
  </head>
  <body>
    <main>
      <h1>ビジリス管理は、新しい管理画面へ移りました</h1>
      <p>回答・顧客・計測・アンケートの確認と編集は、新しい管理画面の「ビジリス管理」から行えます。</p>
      <p>新しい回答が届くと、管理画面の上の 🔔 と「回答管理」のタブに件数が出ます。</p>
      <a class="button" href="https://desktop-rmsk0vg.tail8efe0d.ts.net:10002/manage/bijiris/">新しい管理画面を開く</a>
      <p class="note">院内のネットワーク（Tailscale）につながっている端末から開けます。<br />
        このアプリは、ホーム画面から削除してかまいません。</p>
    </main>
    <script>
      // 端末に残っている前の画面の仕組み（Service Worker）を新しくして、前の控えを消す
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("./sw.js?v=20260927-01").then(function (r) { r.update(); }).catch(function () {});
      }
    </script>
  </body>
</html>
