<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>まゆみ助産院 管理アプリ（移転しました）</title>
  <style>
    body { font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; background: #f4f7f4; color: #24352b; margin: 0; padding: 32px 16px; }
    .box { max-width: 560px; margin: 40px auto; background: #fff; border-radius: 16px; padding: 28px 24px; box-shadow: 0 4px 18px rgba(0,0,0,.06); line-height: 1.8; }
    h1 { font-size: 1.25rem; margin: 0 0 12px; color: #2e6b45; }
    a.btn { display: inline-block; margin-top: 12px; padding: 12px 20px; border-radius: 10px; background: #2e6b45; color: #fff; text-decoration: none; font-weight: 700; }
    .sub { font-size: .9rem; color: #5a6b60; margin-top: 16px; }
  </style>
</head>
<body>
  <div class="box">
    <h1>管理アプリは新しい管理画面へ移りました</h1>
    <p>会員・スタンプ・NEWS・カレンダー・商品・注文・通知・データ分析は、すべて新しい管理画面で行えます。</p>
    <a class="btn" href="https://desktop-rmsk0vg.tail8efe0d.ts.net:10002/manage/">新しい管理画面を開く</a>
    <p class="sub">院内のネットワーク（Tailscale）につながっている端末からだけ開けます。開けないときは受付のiPadで開くか、院長にお声がけください。</p>
    <p class="sub">このページは記録を持っていません。以前の管理アプリの記録は、新しい管理画面に引き継がれています。</p>
  </div>
  <script>
    // 以前の管理アプリの Service Worker と保存物を外す。残っていると古い画面が出続ける。
    if (navigator.serviceWorker) {
      navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { r.unregister(); }); });
    }
    if (window.caches) { caches.keys().then(function (ks) { ks.forEach(function (k) { caches.delete(k); }); }); }
  </script>
</body>
</html>
