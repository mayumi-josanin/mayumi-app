[project]
name = "mayumi-server"
version = "0.1.0"
description = "まゆみ助産院アプリのデータベース（PostgreSQL + Django）"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<5.3",
    "psycopg[binary]>=3.1",
    "gunicorn>=22.0",
    "whitenoise>=6.5",
    # 管理画面で上げた画像を縮める
    "pillow>=10.0",
    # QRコードの絵をこのサーバーで描く（外の絵の作り手に頼ると、院内から外へ出られないときに出ない）
    "segno>=1.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-django>=4.8"]

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_test"
testpaths = ["tests"]
