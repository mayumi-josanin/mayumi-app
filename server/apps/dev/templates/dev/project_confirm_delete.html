{% extends "manage/base.html" %}
{% block title %}プロジェクト削除 — まゆみ助産院 管理画面{% endblock %}
{% block topbar_title %}開発{% endblock %}

{% block content %}
<div class="page-header">
  <h1>プロジェクトを削除</h1>
</div>

<div class="card">
  <div class="card-body">
    <p>「<strong>{{ project.name }}</strong>」を削除しますか？関連するタスク・コメントもすべて削除されます。</p>
    <form method="post" style="margin-top: 20px;">
      {% csrf_token %}
      <div class="form-actions">
        <button type="submit" class="btn btn-danger">削除する</button>
        <a href="{% url 'manage:dev:project_detail' project.pk %}" class="btn btn-outline">キャンセル</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
