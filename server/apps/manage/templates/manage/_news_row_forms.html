{% comment %}行ごとの操作用フォーム（公開状況の変更・削除）。table の中に form を置けないので、外に出しておく。{% endcomment %}
<form id="nstat-{{ item.b.rowIdx }}" method="post" action="{% url 'manage:news_status' item.b.rowIdx %}">{% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}"></form>
<form id="ndel-{{ item.b.rowIdx }}" method="post" action="{% url 'manage:news_delete' item.b.rowIdx %}">{% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}"></form>
