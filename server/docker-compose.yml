# まゆみ助産院 データベース
#
#   docker compose up -d
#
# KEM_DDENKI と同じPCで動かすため、ポートは重ならないようにずらしてある。
# （KEM本番 5432/6379/8000、KEM開発 5433/6380/8001）
services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: mayumi
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - mayumi_pgdata:/var/lib/postgresql/data
    ports:
      # データベースも、このPCの中からだけ。LANに開ける理由がない。
      - "127.0.0.1:${DB_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build: .
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-in-production}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      # GAS だけが知っている合鍵。空だと API はすべて拒否する。
      API_KEY: ${API_KEY:-}
      DB_NAME: mayumi
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_HOST: db
      DB_PORT: "5432"
    ports:
      # このPCの中からしか届かないようにする。
      #
      # 0.0.0.0 のままだと、同じLANにいる端末が Tailscale を通さずに
      # 直接 8002 を叩けてしまう。そうなると、呼び出し元のIPを見分けるための
      # X-Forwarded-For を自分で付けられ、呼び出し制限をすり抜けられる。
      # 外へは Funnel（127.0.0.1 へ渡してくる）だけが通り道になる。
      - "127.0.0.1:${WEB_PORT:-8002}:8000"
    volumes:
      - .:/app

volumes:
  mayumi_pgdata:
