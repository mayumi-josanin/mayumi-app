# まゆみ助産院 データベース
#
#   docker compose up -d
#
# KEM_DDENKI と同じPCで動かすため、ポートは重ならないようにずらしてある。
# （KEM本番 5432/6379/8000、KEM開発 5433/6380/8001）
services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: mayumi
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - mayumi_pgdata:/var/lib/postgresql/data
    ports:
      # データベースも、このPCの中からだけ。LANに開ける理由がない。
      - "127.0.0.1:${DB_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build: .
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-in-production}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      # GAS だけが知っている合鍵。空だと API はすべて拒否する。
      API_KEY: ${API_KEY:-}
      # GAS が札（トークン）の署名に使っている秘密。**変えないこと。**
      # 変えると、お客様の端末にある発行済みの札が全部無効になり、
      # 全員がログイン画面に戻される（CLAUDE.md 絶対ルール1）。
      # 段階Bで「GASが作った札をサーバーが同じと判定できるか」を確かめるために要る。
      ADMIN_TOKEN_SECRET: ${ADMIN_TOKEN_SECRET:-}
      DB_NAME: mayumi
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_HOST: db
      DB_PORT: "5432"
    ports:
      # このPCの中からしか届かないようにする。
      #
      # 0.0.0.0 のままだと、同じLANにいる端末が Tailscale を通さずに
      # 直接 8002 を叩けてしまう。そうなると、呼び出し元のIPを見分けるための
      # X-Forwarded-For を自分で付けられ、呼び出し制限をすり抜けられる。
      # 外へは Funnel（127.0.0.1 へ渡してくる）だけが通り道になる。
      - "127.0.0.1:${WEB_PORT:-8002}:8000"
    volumes:
      - .:/app
      # **お客様の写真は volume に置く。**`.:/app` の中に置くと、
      # 手元のリポジトリに入り込み、git に載りかねない。
      # 作り直しても消えないようにするためでもある。
      - mayumi_media:/app/media

  # 院の管理画面（/manage/）。web と同じ中身・同じデータベースだが、
  # **Funnel には出さない。**Tailscale の中にだけ出す（予約システムの管理画面と同じ分け方）:
  #
  #     tailscale serve --bg --https=10002 http://127.0.0.1:8005
  #
  # → https://desktop-rmsk0vg.tail8efe0d.ts.net:10002/manage/
  manage:
    build: .
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      MANAGE_ENABLED: "true"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-in-production}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_ALLOWED_HOSTS: ${MANAGE_ALLOWED_HOSTS:-desktop-rmsk0vg.tail8efe0d.ts.net,localhost,127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${MANAGE_CSRF_TRUSTED_ORIGINS:-https://desktop-rmsk0vg.tail8efe0d.ts.net:10002}
      API_KEY: ${API_KEY:-}
      ADMIN_TOKEN_SECRET: ${ADMIN_TOKEN_SECRET:-}
      # お客様アプリへの通知（OneSignal）。GAS のスクリプトプロパティと同じ値を .env に
      ONESIGNAL_APP_ID: ${ONESIGNAL_APP_ID:-}
      ONESIGNAL_REST_API_KEY: ${ONESIGNAL_REST_API_KEY:-}
      # 予約管理（mayumi-reserve）とのログインの受け渡し。両方の .env に同じ値
      MANAGE_SSO_SECRET: ${MANAGE_SSO_SECRET:-}
      RESERVE_MANAGE_URL: ${RESERVE_MANAGE_URL:-https://desktop-rmsk0vg.tail8efe0d.ts.net:10001}
      # 上げた画像の公開URL。お客様は Funnel（web）側から見るので、そちらの住所を書く
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://mayumi-api.tail8efe0d.ts.net}
      # 公式サイト（mayumi-site）。下の volume で /site に載せる。鍵は .env（setkey.ps1）
      SITE_REPO_DIR: /site
      SITE_GIT_TOKEN: ${SITE_GIT_TOKEN:-}
      DB_NAME: mayumi
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_HOST: db
      DB_PORT: "5432"
    ports:
      - "127.0.0.1:${MANAGE_PORT:-8005}:8000"
    volumes:
      - .:/app
      # 画像は web と同じ volume。管理画面で上げたものを web が配る。
      - mayumi_media:/app/media
      # 公式サイトの下書き（draft）。サーバーPCの ~/projects/mayumi-site-draft
      - ${SITE_REPO_HOST_DIR:-../../mayumi-site-draft}:/site

volumes:
  mayumi_pgdata:
  mayumi_media:
